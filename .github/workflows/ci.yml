name: Build, Push, and Deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 - Code Checkout
        uses: actions/checkout@v4

      - name: Step 2 - Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: abdullah8010
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Step 3 - Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: abdullah8010/devops-app:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Step 4 - SSH and Auto-Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull abdullah8010/devops-app:latest
            sudo docker stop web-app || true
            sudo docker rm web-app || true
            sudo docker run -d --name web-app -p 80:80 abdullah8010/devops-app:latest

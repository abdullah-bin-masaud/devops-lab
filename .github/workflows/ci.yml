name: Production CI/CD with Zero-Downtime Blue-Green

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Automated Test Suite
        run: |
          chmod +x tests/test_app.sh
          ./tests/test_app.sh

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: abdullah8010
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: abdullah8010/devops-app:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Blue-Green Zero-Downtime Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull abdullah8010/devops-app:latest

            # 1. Determine active vs target container
            if grep -q "8081" /etc/nginx/sites-available/default; then
                OLD_NAME="web-app-blue"
                NEW_NAME="web-app-green"
                NEW_PORT=8082
            else
                OLD_NAME="web-app-green"
                NEW_NAME="web-app-blue"
                NEW_PORT=8081
            fi

            echo ">>> Active is $OLD_NAME. Deploying $NEW_NAME on port $NEW_PORT..."

            # 2. Spin up new container alongside old one
            sudo docker rm -f $NEW_NAME || true
            sudo docker run -d --name $NEW_NAME -p $NEW_PORT:80 abdullah8010/devops-app:latest

            # 3. Healthcheck on internal port
            sleep 2
            if ! curl -f http://127.0.0.1:$NEW_PORT; then
                echo "❌ Healthcheck failed! Aborting."
                sudo docker rm -f $NEW_NAME
                exit 1
            fi

            # 4. Seamless 0ms Traffic Switch
            sudo sed -i "s/proxy_pass http:\/\/127.0.0.1:[0-9]*/proxy_pass http:\/\/127.0.0.1:$NEW_PORT/" /etc/nginx/sites-available/default
            sudo nginx -t
            sudo systemctl reload nginx
            echo "✅ Traffic switched to $NEW_NAME on port $NEW_PORT!"

            # 5. Safely decommission old container
            sleep 1
            sudo docker stop $OLD_NAME || true
            sudo docker rm $OLD_NAME || true
            echo "✅ Old container $OLD_NAME safely removed."
